name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-cpu-tests:
    name: engine crates (CPU-only tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the GPU crates (forge-cuda, forge-kernels, forge-gpu, forge-engine ...) need nvcc and an NVIDIA GPU: they are built and tested on a GPU machine
      - run: cargo test --release -p forge-core -p forge-tok -p forge-gguf -p forge-quant -p forge-chat

  studio:
    name: forge studio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - run: cargo build --release
      - run: cargo test --lib
      - uses: actions/upload-artifact@v4
        with:
          name: forge-studio-${{ matrix.os }}
          path: |
            studio/target/release/forge-studio
            studio/target/release/forge-studio.exe
          if-no-files-found: ignore
