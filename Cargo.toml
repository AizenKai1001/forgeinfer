[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-gguf",
    "crates/forge-quant",
    "crates/forge-tok",
    "crates/forge-embed",
    "crates/forge-chat",
    "crates/forge-engine",
    "crates/forge-serve",
    "crates/forge-model",
    "crates/forge-cuda",
    "crates/forge-kernels",
    "crates/forge-gpu",
    "crates/forge-embed-gpu",
    "crates/forge-train",
    "crates/forge-cli",
]
# throwaway feasibility spikes keep their own manifests
exclude = ["spikes/avx2_rust", "spikes/cuda_ffi", "spikes/threadpool"]

[workspace.package]
version = "0.1.10"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
panic = "unwind"

# tests run on large golden files and whole models: optimise them too
[profile.test]
opt-level = 3
